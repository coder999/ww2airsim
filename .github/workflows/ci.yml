name: CI
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# `push: branches: ['**']` plus `pull_request` double-runs every same-repo PR
# branch (once for the push, once for the PR). Keying the concurrency group
# on workflow + ref (not the event) means both runs for the same branch share
# a group, so the older one is cancelled rather than left to finish pointlessly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise
      - run: npm test

# No GPU on hosted runners, so there are no Tier 2 render checks here -- that
# is deliberate per spec §11, not an omission.
