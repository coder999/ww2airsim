name: CI
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# `push: branches: ['**']` plus `pull_request` double-runs every same-repo PR
# branch (once for the push, once for the PR). `github.ref` alone does NOT
# unify those two runs' groups: for a push event it is `refs/heads/<branch>`,
# but for a pull_request event it is the synthetic `refs/pull/<n>/merge`, a
# different string for the same commit -- verified 2026-09-12 against
# GitHub's own context docs (github.head_ref is "only available when the
# event that triggers a workflow run is either pull_request or
# pull_request_target"; github.ref_name for a push is the branch's short
# name with no prefix). `github.head_ref` (source branch short name, set
# only on pull_request/pull_request_target) falls back to `github.ref_name`
# (branch short name, set on push) for a push event -- both resolve to the
# same short branch name for the same branch, so this is the expression that
# actually puts a branch's push-triggered and PR-triggered runs in one group
# and lets the older one be cancelled. `github.event.pull_request.number ||
# github.ref` does not do this: the push run still keys off github.ref
# (refs/heads/<branch>) and the PR run keys off the PR number, still two
# different strings.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Deliberately NO `lfs: true` here (Task 2 review, 2026-09-25).
      # `content/terrain/L0.bin` (134 MB, committed via Git LFS since
      # 2026-09-24) would need it to arrive as real bytes instead of a
      # ~130-byte pointer -- but this workflow runs on every push to every
      # branch AND every PR, and GitHub LFS's free tier is 1 GB/month
      # bandwidth: one `lfs: true` checkout here is roughly 13% of that
      # quota, so a handful of pushes in a single day would exhaust it.
      # `deploy.yml` (manual, low-frequency, gates an actual release) pays
      # that cost instead -- it DOES `lfs: true`, and is where L0's real
      # bytes are actually verified before anything ships.
      #
      # The tests that need L0's real content (`tests/build/dist.test.ts`'s
      # byte-count assertion, `tests/tools/terrainBuild.test.ts`'s SHA-256
      # pin, `tests/render/terrainLod.test.ts`'s mip-0 table) detect the
      # pointer via `tools/terrain/load.ts`'s `hasRealLevelFile` and SKIP
      # with a named reason rather than fail -- confirmed by simulating a
      # pointer file in place of the real one and re-running all three
      # (2026-09-25): 5 named skips, 14 passes, no failures. Every OTHER
      # test (all ~14 files reading `finestFetchedLevelFor('low')`'s L1, and
      # everything not terrain-related) is unaffected: `L1.bin` and coarser
      # are plain git blobs, always real on any checkout, LFS or not.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise
      - run: npm test

# No GPU on hosted runners, so there are no Tier 2 render checks here -- that
# is deliberate per spec §11, not an omission.
