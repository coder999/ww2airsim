name: Nightly soak
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Long soak
        id: soak
        # Ruling R9: `set -o pipefail` MUST run before the `tee` pipeline. A
        # pipeline's exit status is its last command's, which here is `tee`,
        # not vitest -- without pipefail a failing test still reports success
        # to the step and the job goes green. This exact trap shipped a red
        # JS test to production on this fleet on 2026-09-09 (see
        # feedback-gate-commits-on-test-exit-status.md).
        shell: bash
        run: |
          set -o pipefail
          npx vitest run tests/sim/soak.test.ts --reporter=verbose 2>&1 | tee soak.log
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let log = ''
            try { log = fs.readFileSync('soak.log', 'utf8').slice(-4000) } catch {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly soak failed on ${new Date().toISOString().slice(0, 10)}`,
              body: [
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '```',
                log,
                '```',
              ].join('\n'),
              labels: ['soak-failure'],
            })
