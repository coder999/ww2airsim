name: Nightly soak
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      # Deliberately NO `lfs: true` here (Task 2 review, 2026-09-25), same
      # bandwidth reasoning as `ci.yml`'s own comment. This job only runs
      # `tests/sim/soak.test.ts`, which reads `finestFetchedLevelFor('low')`'s
      # L1 -- a plain git blob, always real, LFS or not -- and never touches
      # L0.bin, so this workflow does not need `lfs: true` even setting
      # bandwidth aside.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Long soak
        id: soak
        # Ruling R9: `set -o pipefail` MUST run before the `tee` pipeline. A
        # pipeline's exit status is its last command's, which here is `tee`,
        # not vitest -- without pipefail a failing test still reports success
        # to the step and the job goes green. This exact trap shipped a red
        # JS test to production on this fleet on 2026-09-09 (see
        # feedback-gate-commits-on-test-exit-status.md).
        shell: bash
        run: |
          set -o pipefail
          npx vitest run tests/sim/soak.test.ts --reporter=verbose 2>&1 | tee soak.log
      - name: Open or update an issue on failure
        # Scoped to the soak step specifically, not the job as a whole
        # (Folded minor 5) -- an unscoped `if: failure()` would also fire on
        # a transient `npm ci` or `actions/setup-node` failure and open an
        # issue whose body is an empty log fence, since soak.log would never
        # have been written.
        if: failure() && steps.soak.conclusion == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            let log
            try {
              log = fs.readFileSync('soak.log', 'utf8').slice(-4000)
            } catch (e) {
              // Folded minor 5: an empty `catch {}` here silently turned a
              // read failure into an empty log fence with no indication
              // anything went wrong reading it.
              log = `(soak.log could not be read: ${e.message})`
            }

            // A raw ``` fence inside the log (e.g. an assertion message that
            // itself quotes a code block) would otherwise close the fence
            // early and corrupt the rest of the issue body -- use a fence
            // one backtick longer than the longest run already in the log.
            const longestBacktickRun = Math.max(
              3,
              ...(log.match(/`+/g) ?? []).map((run) => run.length + 1),
            )
            const fence = '`'.repeat(longestBacktickRun)

            const date = new Date().toISOString().slice(0, 10)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            // Important 3: the date lives in the comment body, not the
            // title, so the title stays stable across nights and can be
            // matched against on the next failure instead of spawning a new
            // issue every time.
            const body = [
              `Nightly soak failed on ${date}.`,
              '',
              `Run: ${runUrl}`,
              '',
              fence,
              log,
              fence,
            ].join('\n')

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'soak-failure',
            })

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Nightly soak is failing',
                body,
                labels: ['soak-failure'],
              })
            }
