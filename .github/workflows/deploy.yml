name: Deploy ww2airsim to VPS

# Manual only. Pushing main does NOT deploy (fleet rule, 2026-08-26).
on:
  workflow_dispatch:

# Nothing here needs the repo token for anything but the checkout.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # `lfs: true` fetches `content/terrain/L0.bin`'s real 134 MB (Task 2,
      # 2026-09-24) instead of leaving it as a ~130-byte Git LFS pointer.
      # Deliberately set HERE and not on `ci.yml`/`nightly-soak.yml` (see
      # their own comments): this workflow is manual (`workflow_dispatch`)
      # and gates an actual release, so it is worth the real GitHub LFS
      # bandwidth cost (against the free 1 GB/month quota) every time it
      # runs; a plain checkout without this would silently ship a 134-byte
      # pointer as the "terrain," and `npm run verify` below would also fail
      # its own L0 byte-count assertion first.
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Unlike every other site in this fleet, ww2airsim builds -- so the
      # tests can gate the release. A red suite fails the deploy before
      # anything is shipped.
      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      # The committed terrain fallback is what a fresh visitor flies on. If it
      # is missing the world renders as empty sea, which reads as a broken
      # renderer rather than a broken deploy -- so fail here instead.
      #
      # index.html is checked for the same reason but a blunter one: the rsync
      # below runs with --delete, so an empty or half-written dist/ does not
      # merely deploy nothing, it WIPES the live document root. This one-line
      # test is the cheapest insurance in the file.
      - name: Assert the build carries the terrain fallback
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/content/terrain/L4.bin
          test ! -e dist/content/terrain/tiles
          echo "dist size: $(du -sh dist | cut -f1)"

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan vps-4b80346f.vps.ovh.us >> "$HOME/.ssh/known_hosts"

      # --delete so a renamed hashed asset does not accumulate forever. No
      # put-env and no redeploy: this site has no .env, and app/htdocs is a
      # read-only bind mount, so an rsync'd file is served on the next request
      # with no container action and no 502.
      #
      # The trailing slash on `dist/` is load-bearing: without it rsync creates
      # `htdocs/dist/` and index.html never reaches the document root, leaving
      # the site 403 and the container unhealthy forever -- which presents as a
      # routing bug rather than the path bug it is.
      - name: Deploy via rsync
        shell: bash
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ ww2airsim-deploy@vps-4b80346f.vps.ovh.us:htdocs/

      # Every request below carries a `?cb=` key unique to this run and to the
      # check making it. Without one these assertions test CLOUDFLARE'S CACHE,
      # not the deploy, and a stale edge answer is indistinguishable from a
      # correct one. Measured against the live site 2026-09-15 (before Task 2
      # moved L0.bin out of the gitignored `tiles/` directory):
      #
      #   /content/terrain/tiles/L0.bin        -> 404, cf-cache-status: HIT, age: 129
      #   /content/terrain/tiles/L0.bin?cb=... -> 404, cf-cache-status: MISS
      #
      # So the negative assertion -- at the time, the one that existed to
      # catch the 178 MB of gitignored terrain tiles going public, now the
      # scratch-tiles-directory check further down -- was the single most
      # foolable check in this file: a deploy that really did publish them
      # could have been answered 404 from cache and gone green.
      #
      # The key varies per request, not just per run, so no attempt can be
      # served a response that an earlier attempt in the same run populated.
      - name: Verify the live site
        shell: bash
        run: |
          set -euo pipefail
          base=https://ww2airsim.com
          cb=${{ github.run_id }}

          # The container's healthcheck fetches `/`, which 403s while htdocs is
          # empty, and Traefik's Docker provider drops an unhealthy container's
          # router entirely -- so until one probe passes AFTER the rsync above,
          # the hostname 404s from Traefik rather than answering from nginx.
          # The healthcheck interval is 120s, so the very first deploy has to
          # poll instead of asserting once. On an already-healthy site the
          # first attempt wins and this costs one request.
          #
          # This loop in particular must not be answerable from cache: a
          # cached 200 would end the wait while the router still did not exist.
          started=$SECONDS
          deadline=$(( SECONDS + 300 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/?cb=$cb-home-$attempt") || code=000
            if [ "$code" = "200" ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::homepage returned $code after waiting ${SECONDS}s for the router"
              exit 1
            fi
            echo "waiting for the router to appear (got $code)"
            sleep 10
          done
          # Printed on success so a deploy creeping from ~72s toward the 300s
          # deadline is visible rather than silently green.
          echo "homepage 200 after $(( SECONDS - started ))s, $attempt attempt(s)"

          # `$R` is deliberately absent: the hand-run version of these checks
          # pins --resolve because nexus caches this name as NXDOMAIN, but a
          # GitHub runner resolves it normally and an unset variable under
          # `set -u` would abort the step.

          # One fetch, headers and body together, so the header assertions and
          # the asset name below cannot come from two different responses.
          hdrs=$(mktemp)
          home=$(curl -sS -D "$hdrs" "$base/?cb=$cb-index") \
            || { echo "::error::could not fetch the live homepage"; exit 1; }
          grep -qi '^x-robots-tag: *noindex' "$hdrs" \
            || { echo "::error::noindex header missing"; exit 1; }
          grep -qi '^cache-control:.*no-cache' "$hdrs" \
            || { echo "::error::homepage is not no-cache"; exit 1; }

          # The check that actually distinguishes "deployed" from "still
          # serving yesterday's bundle". The filename is read from the LIVE
          # index.html rather than hardcoded, so a stale index.html paired with
          # a working old asset -- which passes every other check here -- fails
          # this one.
          asset=$(printf '%s' "$home" | grep -oP 'assets/[^"]+\.js' | head -1) || true
          test -n "$asset" \
            || { echo "::error::the live index.html names no hashed asset"; exit 1; }
          echo "live index.html names $asset"
          acode=$(curl -sS -o /dev/null -w '%{http_code}' "$base/$asset?cb=$cb-asset")
          test "$acode" = "200" \
            || { echo "::error::$asset, named by the live index.html, returned $acode"; exit 1; }

          curl -sS "$base/robots.txt?cb=$cb-robots" | tr -d '\r' | grep -qx 'Disallow: /' \
            || { echo "::error::robots.txt does not disallow everything"; exit 1; }

          tcode=$(curl -sS -o /dev/null -w '%{http_code}' "$base/content/terrain/L4.bin?cb=$cb-l4")
          test "$tcode" = "200" || { echo "::error::terrain L4 returned $tcode"; exit 1; }
          # L0.bin is INTENTIONALLY public since Task 2 (2026-09-24) -- it is
          # committed content (via Git LFS), fetched by `medium`/`high`/
          # `ultra` Asset Quality tiers -- unlike before that task, when it
          # lived gitignored in `tiles/` and this line asserted the opposite
          # (a 404). A 200 here also confirms this deploy's checkout smudged
          # the real bytes rather than shipping the ~130-byte LFS pointer,
          # which `npm run verify` above would already have caught via its
          # own exact-byte-count assertion -- this is the same fact,
          # confirmed on the actual live site rather than only in CI.
          l0code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/content/terrain/L0.bin?cb=$cb-l0")
          test "$l0code" = "200" || { echo "::error::content/terrain/L0.bin returned $l0code, not 200"; exit 1; }
          # The gitignored terrain scratch directory must never be public.
          # The build test proves the whole directory is excluded on a
          # checkout where it exists; this live 404 is defense in depth for
          # the deployed path that the old L0 check used before L0 moved out.
          scode=$(curl -sS -o /dev/null -w '%{http_code}' "$base/content/terrain/tiles/L6-preview.png?cb=$cb-tiles")
          test "$scode" = "404" || { echo "::error::the scratch tiles/ directory is public ($scode)"; exit 1; }
          echo "live site verified"
